[project]
name = "detection-events-processor"
version = "0.1.0"
description = "Validates and processes STLS detection events."
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5.0",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "redis>=5.2.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
