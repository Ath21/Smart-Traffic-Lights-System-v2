[project]
name = "sensor-data-processor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.1",
    "pydantic>=2.14.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
