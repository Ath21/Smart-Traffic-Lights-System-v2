[project]
name = "stls-workload-generator"
version = "0.1.0"
description = "Synthetic sensor workload generator for UNIWA STLS 2.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
