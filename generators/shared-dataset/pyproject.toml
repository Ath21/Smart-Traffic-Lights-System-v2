[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "stls-dataset"
version = "0.1.0"
description = "Shared dataset and simulation utilities for STLS workload generators."
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/stls_dataset"]

[tool.hatch.build.targets.wheel.force-include]
"src/stls_dataset/stls_traffic_counts.json" = "stls_dataset/stls_traffic_counts.json"
"src/stls_dataset/stls_detection_events.json" = "stls_dataset/stls_detection_events.json"
